<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#161816" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Synapse" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="description" content="CRM de vendas + mentalidade comercial, com autenticação e persistência em nuvem." />
<title>Synapse | Gestão comercial e mentalidade</title>

<link rel="manifest" href="manifest.json?v=13" />
<link rel="icon" href="favicon-32.png?v=13" type="image/png" sizes="32x32" />
<link rel="icon" href="icon-192.png?v=13" type="image/png" sizes="192x192" />
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=13" />

<style>
  #synapse-install-button {
    position: fixed;
    left: 50%;
    bottom: max(16px, env(safe-area-inset-bottom));
    transform: translateX(-50%);
    z-index: 9999;
    display: none;
    border: 0;
    border-radius: 999px;
    padding: 11px 18px;
    background: #161816;
    color: #fff;
    font: 600 14px/1 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    box-shadow: 0 8px 24px rgba(0,0,0,.22);
    cursor: pointer;
  }
  #synapse-install-button.is-visible { display: block; }

  /* Carregamento: usa o logo raster de 512px, sem o antigo "S" de texto.
     O próprio ícone PWA já tem 30% de margem branca para o mobile. */
  .cloud-load-spinner {
    width: min(180px, 42vw) !important;
    height: min(180px, 42vw) !important;
    min-width: 0 !important;
    min-height: 0 !important;
    border: 0 !important;
    border-radius: 0 !important;
    background: #fff url('./synapse-logo.svg?v=13') center center / 100% 100% no-repeat !important;
    box-shadow: none !important;
    font-size: 0 !important;
    color: transparent !important;
    animation: none !important;
  }
</style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js" integrity="sha512-QVs8Lo43F9lSuBykadDb0oSXDL/BbZ588urWVCRwSIoewQv/Ewg1f84mK3U790bZ0FfhFa1YSQUmIhG+pIRKeg==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js" integrity="sha512-6a1107rTlA4gYpgHAqbwLAtxmWipBdJFcq8y5S/aTge3Bp+VAklABm2LO+Kg51vOWR9JMZq1Ovjl5tpluNpTeQ==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js" integrity="sha384-EnyY0/GSHQGSxSgMwaIPzSESbqoOLSexfnSMN2AP+39Ckmn92stwABZynq1JyzdT" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0/dist/umd/supabase.js" crossorigin="anonymous"></script>

<script src="config.js" defer></script>
<script src="synapse-runtime.js" defer></script>
<script src="services/supabase.js" defer></script>
<script src="backend.js" defer></script>
<script src="services/persistence.js" defer></script>
<link rel="stylesheet" href="styles.css" />
</head>
<body>
<div id="root"></div>
<button id="synapse-install-button" type="button" aria-label="Instalar Synapse">Instalar Synapse</button>
<script src="app.js" defer></script>
<script>
  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js?v=13').catch(() => {});
    });
  }

  let deferredInstallPrompt = null;
  const installButton = document.getElementById('synapse-install-button');

  window.addEventListener('beforeinstallprompt', (event) => {
    event.preventDefault();
    deferredInstallPrompt = event;
    installButton.classList.add('is-visible');
  });

  installButton.addEventListener('click', async () => {
    if (!deferredInstallPrompt) return;
    deferredInstallPrompt.prompt();
    await deferredInstallPrompt.userChoice;
    deferredInstallPrompt = null;
    installButton.classList.remove('is-visible');
  });

  window.addEventListener('appinstalled', () => {
    deferredInstallPrompt = null;
    installButton.classList.remove('is-visible');
  });
</script>
</body>
</html>
